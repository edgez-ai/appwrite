name: "Release"

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Docker image tag to publish
        required: true
        type: string
        default: devices-latest

jobs:
  tests:
    name: Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        # We must fetch at least the immediate parents so that if this is
        # a pull request then we can checkout the head.
        fetch-depth: 2
        # Fetch submodules
        submodules: recursive

    - name: Set up QEMU
      uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

    - name: Login to Docker Hub
      uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Resolve image tag
      id: vars
      shell: bash
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
        INPUT_TAG: ${{ inputs.tag }}
      run: |
        tag="${RELEASE_TAG:-$INPUT_TAG}"
        if [[ ! "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
          echo "Invalid Docker tag: $tag" >&2
          exit 1
        fi
        echo "tag=$tag" >> "$GITHUB_OUTPUT"

    - name: Build and push
      uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        target: production
        build-args: |
          VERSION=${{ steps.vars.outputs.tag }}
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/appwrite:${{ steps.vars.outputs.tag }}
          ${{ secrets.DOCKERHUB_USERNAME }}/appwrite:latest
